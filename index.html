<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Payment Form</title>
</head>

<body>

    <div class="container my-5">
        <div class="card">
            <div class="card-header bg-light pt-3 ps-2">
                <h5>Payment form example</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-danger">
                    Some fields are missing
                </div>
                <form action="">
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Card #</label>
                            <input type="text" class="form-control" placeholder="XXXXXXXXXXXXXXX" required>
                        </div>
                        <div class="col-3">
                            <label class="form-label">CVC #</label>
                            <input type="number" class="form-control" placeholder="0000" required>
                        </div>
                        <div class="col-3">
                            <label class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" placeholder="Amount" required>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-3">
                            <label class="form-label">State</label>
                            <select class="form-select" required>
                                <option value="" disabled selected>Pick a state</option>
                                <option value="CA">California</option>
                                <option value="NY">New York</option>
                                <option value="TX">Texas</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <label class="form-label">Postal Code</label>
                            <input type="number" class="form-control" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label d-block">We accept:</label>
                            <div class="bg-secondary p-2 rounded d-inline-flex gap-3 align-items-center">
                                <input type="radio" name="card" value="mastercard"> <i
                                    class="fa-brands fa-cc-mastercard fa-xl"></i>
                                <input type="radio" name="card" value="visa"> <i class="fa-brands fa-cc-visa fa-xl"></i>
                                <input type="radio" name="card" value="diners"> <i
                                    class="fa-brands fa-cc-diners-club fa-xl"></i>
                                <input type="radio" name="card" value="american"> <i
                                    class="fa-brands fa-cc-amex fa-xl"></i>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4"></textarea>
                            <small class="text-muted">Add any notes here.</small>
                        </div>
                    </div>
                </form>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2 py-3">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
